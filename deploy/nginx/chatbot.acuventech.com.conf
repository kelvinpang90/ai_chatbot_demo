# AI Chatbot Demo vhost
# 部署到 VPS 后复制到 /srv/infra/nginx/conf.d/chatbot.acuventech.com.conf

server {
    listen 80;
    server_name chatbot.acuventech.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name chatbot.acuventech.com;

    ssl_certificate     /etc/nginx/certs/acuventech.crt;
    ssl_certificate_key /etc/nginx/certs/acuventech.key;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 用变量驱动 proxy_pass，让 nginx 每次请求都用 Docker 内置 resolver 重新解析容器名，
    # 避免容器重建后 IP 变了但 nginx 缓存旧 IP 导致 502。
    set $chatbot_frontend "ai_chatbot_frontend:80";

    # 前端容器自己的 nginx 会区分静态文件 / /api/ / /webhook/ 转发给后端，
    # 这里统一转发给前端容器即可，路由逻辑和本地开发环境完全一致。
    location / {
        proxy_pass http://$chatbot_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
