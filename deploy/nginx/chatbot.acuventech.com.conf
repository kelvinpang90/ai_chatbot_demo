# AI Chatbot Demo vhost
# 部署到 VPS 后复制到 /srv/infra/nginx/conf.d/chatbot.acuventech.com.conf

server {
    listen 80;
    server_name chatbot.acuventech.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name chatbot.acuventech.com;

    ssl_certificate     /etc/nginx/certs/acuventech.crt;
    ssl_certificate_key /etc/nginx/certs/acuventech.key;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 用变量驱动 proxy_pass，让 nginx 每次请求都用 Docker 内置 resolver 重新解析容器名，
    # 避免容器重建后 IP 变了但 nginx 缓存旧 IP 导致 502。
    set $chatbot_frontend "ai_chatbot_frontend:80";

    # 导演台的 SSE 流（任务 12）。单独开一条 location 只为了关掉缓冲：
    # nginx 会把后端的 X-Accel-Buffering 自己消化掉、不往客户端传，所以里层
    # 前端容器关了缓冲不代表这一跳也关了，攒住的正是这块屏要实时显示的事件。
    # 这条流本身由后端的 CONSOLE_TOKEN 把守，见 backend/app/routers/console.py。
    location = /console/stream {
        proxy_pass http://$chatbot_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # 前端容器自己的 nginx 会区分静态文件 / /api/ / /webhook/ 转发给后端，
    # 这里统一转发给前端容器即可，路由逻辑和本地开发环境完全一致。
    location / {
        proxy_pass http://$chatbot_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
