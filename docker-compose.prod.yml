services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: ai_chatbot_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # db 16: crm_os holds 0-4 and erp_os 5-11 on this same instance, and
    # vps_infra's README allocates numbers in blocks of 16 per project.
    #
    # MYSQL_URL is not here and cannot be: it carries the audit database's
    # password, and this file is in a public repository. It comes from
    # backend/.env instead. Unset there means the audit log is off, which is a
    # quiet failure by design -- `docker logs ai_chatbot_backend | grep "audit
    # log"` is what says so.
    environment:
      - REDIS_URL=redis://infra_redis:6379/16
      # Every audit timestamp and every log line is written in the container's
      # local time, and a DATETIME column keeps no timezone to correct it by
      # later. Left unset this container runs on UTC, so a demo run at 9pm in
      # Kuala Lumpur files itself under 13:00 and cannot be found by the hour it
      # happened. vps_infra sets this on all four of its containers; this one had
      # simply never needed a clock before.
      - TZ=Asia/Kuala_Lumpur
    networks:
      - default
      - proxy_net
      - data_net

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: ai_chatbot_frontend
    restart: unless-stopped
    networks:
      - default
      - proxy_net

networks:
  proxy_net:
    external: true
  # infra_redis lives here and publishes no host port, so this is the only way
  # to reach it. Created by vps_infra, same as proxy_net.
  data_net:
    external: true
